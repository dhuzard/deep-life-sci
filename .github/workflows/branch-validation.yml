name: Branch validation

on:
  push:
    branches:
      - issue-1-run-source-provenance
  workflow_dispatch:

jobs:
  offline:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Sync test and lint dependencies
        run: uv sync --group test --group dev
      - name: Focused provenance tests
        run: uv run pytest tests/test_source_trace.py tests/test_source_trace_runtime.py -q
      - name: Offline tests
        run: uv run pytest
      - name: Ruff
        run: uv run ruff check .

  live-provenance:
    name: Live provenance probe
    runs-on: ubuntu-latest
    env:
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync runtime dependencies
        run: uv sync
      - name: Run inspectable PubMed provenance probe
        if: ${{ env.LANGSMITH_API_KEY != '' }}
        run: |
          uv run python - <<'PY'
          import asyncio
          import json

          from deep_life_sci.runner import run_once

          QUESTION = (
              "Using PubMed, find Egan et al.'s 2011 Shaw-lab paper on AMPK "
              "phosphorylation of ULK1 under energy stress. Retrieve the source "
              "content and report the phosphorylation sites, citing the PMID."
          )

          result = asyncio.run(run_once(QUESTION, quiet=True))
          evidence = {
              "answer": result.answer,
              "tool_calls": result.tool_calls,
              "source_trace": result.source_trace,
          }
          print("PROVENANCE_PROBE")
          print(json.dumps(evidence, indent=2, sort_keys=True))

          assert "21205641" in result.answer, "final answer did not cite the target PMID"
          assert "21205641" in result.source_trace.get("pmids", []), (
              "target PMID was cited but its source content was not retrieved in this run"
          )
          events = result.source_trace.get("events", [])
          assert any(event.get("tool") == "pubmed_search" for event in events)
          assert any(
              event.get("tool") == "fetch_abstracts"
              and "21205641" in event.get("returned_ids", [])
              for event in events
          ), "target PubMed abstract was not retrieved through the traced source seam"
          PY
      - name: Explain unavailable live probe
        if: ${{ env.LANGSMITH_API_KEY == '' }}
        run: |
          echo "LIVE_PROVENANCE_PROBE_SKIPPED: LANGSMITH_API_KEY is not configured for Actions."
