name: Branch validation

on:
  push:
    branches:
      - validate-pr6-review-fixes
  workflow_dispatch:

jobs:
  offline:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Sync test and lint dependencies
        run: uv sync --group test --group dev
      - name: Focused provenance tests
        run: uv run pytest tests/test_source_trace.py tests/test_source_trace_runtime.py tests/test_invariants.py -q
      - name: Offline tests
        run: uv run pytest
      - name: Ruff
        run: uv run ruff check .
